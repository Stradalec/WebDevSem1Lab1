<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset= "UTF-8">
    <link rel="stylesheet" href="css/styles.css" />
	<title>Home</title>
</head>
<body>
    <header>
        <picture id="header-logo" class="header_logo">
            <source media= "(min-width: 360)"  srcset="path">
	        <img src= "assets/vector/header-logo.svg">
        </picture>
        <nav id ="navigation_menu" class="navigation_menu">
             <ul class="navigation_menu_list">
                <li><a href="#">Home</a></li>
                <li><a href="#">Story</a></li>
                <li><a href="#">Gallery</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>
            <section id="header-icons-section" class="navigation_menu_icons">
                <picture id = "header-search-icon" class="navigation_menu_icons">
                    <source media= "(min-width: 360 px)"  srcset="path">
	                <img src= "assets/vector/header-search-icon.svg">
                </picture>
                <picture id = "header-profile-icon" class="navigation_menu_icons">
                    <source media= "(min-width: 360 px)"  srcset="path">
	                <img src= "assets/vector/header-profile-icon.svg">
                </picture>
            </section>           
        </nav>        
    </header>
    <main>
        <section id="hero_section" class="main_background">
            <h1 id = "hero_text_header" class = "left_side_header"> Let’s talk about <br> your next trip!</h1>
            <p id = "hero_text_article" class="left_side"> Share your favorite travel destination and we will <br> feature it in our next blog!</p>
            <section id = "hero_buttons" class="left_side">
                <button id = "share" type="button" value="button" class="left_side_button">
                    Share your story
                </button>
                <picture id = "hero-player" class="navigation_menu_icons">
                    <source media="(min-width: 360 px)"  srcset="path">
	                <img src= "assets/vector/hero-player.svg" alt="Watch highlights">
                    <figcaption>Watch highlights</figcaption>
                </picture>              
            </section>
            
        </section>
        <section id="picture_section" class="left_side">
            <picture id = "left-picture" >
                    <source media="(min-width: 360 px)"  srcset="path">
	                <img src= "assets/images/image.jpg" alt="Watch highlights"> 
            </picture>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
